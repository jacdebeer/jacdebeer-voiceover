<div class="wrap">
  <div class="head">
    <h1 id="pTitle"></h1>
    <p id="pSub"></p>
    <div class="meta" id="pMeta"></div>
  </div>
  <div class="nav" id="pNav"></div>
  <div id="voiceBanner" style="display:none;font-size:.78rem;padding:8px 12px;border-radius:8px;margin-bottom:10px;text-align:center"></div>
  <div class="stage" id="pStage"></div>
  <div class="cap" id="pCap"></div>
  <div class="ctrl">
    <button id="bPrev">&#8249;</button>
    <button id="bPlay" class="pri"></button>
    <button id="bNext">&#8250;</button>
    <div class="bar"><i id="bFill"></i></div>
    <span id="bClock" class="clock"></span>
    <button id="bAll"></button>
    <button id="bVoice" class="pri">&#128266;</button>
    <select id="bVoiceSel" style="display:none;font-family:inherit;font-size:.75rem;padding:7px;border-radius:8px;border:1px solid var(--line);max-width:190px"></select>
    <button id="bFull" title="Full screen">&#9974;</button>
    <button id="bScript">&#128220;</button>
    <button id="bPrint">&#128424;</button>
  </div>
  <div id="scriptPane" style="display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <b id="scriptHead" style="font-size:.95rem"></b>
      <button id="bSelAll" style="font-family:inherit;font-size:.75rem;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer"></button>
      <span id="scriptHint" style="font-size:.72rem;color:var(--ink2)"></span>
    </div>
    <div id="scriptBody" style="font-size:.95rem;line-height:1.75"></div>
  </div>
  <div class="foot" id="pFoot"></div>
</div>
